# 用这段内容【替换】仓库里已有的 .github/workflows/bootstrap.yml
# 修复：GITHUB_TOKEN 不允许推送 .github/workflows/ 下的文件，
#       所以不再「铺开后派发」，改成本 workflow 解压后直接编译出 IPA。
name: J2ME iOS 构建
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 展开工程并同步到仓库
        run: |
          set -e
          if [ ! -f ios/project.yml ]; then
            rm -rf /tmp/j2me
            z=$(ls *.zip 2>/dev/null | head -1) || true
            [ -n "$z" ] || { echo "::error::仓库里既没有工程文件也没有 ZIP"; exit 1; }
            unzip -q "$z" -d /tmp/j2me
            cp -a /tmp/j2me/BBK9588-J2ME-iOS/. .
            rm -f "$z"
            # GITHUB_TOKEN 不能创建/修改 workflow 文件；本文件已是构建入口
            rm -f .github/workflows/ios.yml .github/workflows/ios-release.yml
            chmod +x scripts/*.sh
            git config user.name  bot
            git config user.email bot@users.noreply.github.com
            git add -A
            git commit -m "展开 J2ME iOS 工程" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::同步失败，不影响本次编译"
          fi
      - name: 工具链
        run: bash scripts/check-env.sh
      - name: 编译 App
        run: bash scripts/build-app.sh
      - name: 打包 IPA
        run: bash scripts/package-ipa.sh build/J2ME-unsigned.ipa
      - name: 校验和
        run: cd build && shasum -a 256 *.ipa > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: J2ME-iOS-IPA
          path: |
            build/*.ipa
            build/SHA256SUMS.txt
          if-no-files-found: error
